<style>

</style><style>
:root{--glass:rgba(255,255,255,.64);--gb:rgba(255,255,255,.75);--sh:0 8px 30px rgba(79,70,229,.12);--bo:.5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(26,31,72,.58);--gb:rgba(255,255,255,.09);--sh:0 8px 30px rgba(0,0,0,.4);--bo:.3}}

body{overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:var(--bo);pointer-events:none}

.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}

.in .row{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.in .row:nth-child(n+3){animation-delay:.2s}.in .row:nth-child(n+4){animation-delay:.28s}.in .row:nth-child(n+5){animation-delay:.36s}.in .row:nth-child(n+6){animation-delay:.44s}
main>h1:first-child{font-size:28px;font-weight:800;background:linear-gradient(90deg,#4f46e5,#a855f7,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:24px}

.btn{background:linear-gradient(135deg,#4f46e5,#8b5cf6 60%,#c026d3);box-shadow:0 8px 20px rgba(99,102,241,.35);transition:transform .15s,box-shadow .2s;font-weight:600}

nav span{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}nav button.on span{transform:translateY(-2px) scale(1.18)}
.cd{transition:transform .15s,background .2s}.cd.sl{background:linear-gradient(135deg,#4f46e5,#a855f7);box-shadow:0 6px 14px rgba(99,102,241,.5);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}

</style></head><body><main id="app"></main>

<script>
const D=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const M=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const P=[['08:00','09:15'],['09:30','10:50'],['11:10','12:25'],['13:00','14:15']];
const fa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function g2j(gy,gm,gd){var t=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy,days=355666+365*gy+~~((g2+3)/4)-~~((g2+99)/100)+~~((g2+399)/400)+gd+t[gm-1],jy=-1595+33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}return[jy,days<186?1+~~(days/31):7+~~((days-186)/30),1+(days<186?days%31:(days-186)%30)]}
function j2g(jy,jm,jd){jy+=1595;var days=-355668+365*jy+~~(jy/33)*8+~~(((jy%33)+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}var gd=days+1,a=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31],gm;for(gm=0;gm<13&&gd>a[gm];gm++)gd-=a[gm];return[gy,gm,gd]}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
const diff=(a,b)=>Math.round((utc(a)-utc(b))/864e5);
const wdOf=d=>(d.getDay()+1)%7;
const jal=d=>g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
const jstr=d=>{const j=jal(d);return fa(j[2])+' '+M[j[1]-1]};
const jfull=d=>{const j=jal(d);return fa(j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0'))};
function parseJ(t){const p=en(t).split(/[\/\-.]/).map(Number);if(p.length!=3||p.some(isNaN))return null;const g=j2g(p[0],p[1],p[2]);return iso(new Date(g[0],g[1]-1,g[2]))}
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const next=wd=>{const t=new Date();return add(t,(wd-wdOf(t)+7)%7)};
const SEED=[[0,0,1,'ورزش','عاطف‌بخت'],[0,1,1,'ادبیات','محمدیان'],[0,2,2,'تجارت الکترونیک','صادقی'],[1,0,2,'شبکه','بیات‌فر'],[1,2,1,'دانش فنی تخصصی','جانبازی'],[1,3,1,'ریاضی','کشاورز'],[2,0,1,'دفاعی','فراهانی','A'],[2,0,1,'اخلاق حرفه‌ای','سیفی','B'],[2,1,1,'مدیریت خانواده','نقوی'],[2,2,1,'دینی','اصغری'],[2,3,1,'دانش فنی تخصصی','جانبازی'],[3,0,1,'ریاضی','کشاورز'],[3,1,1,'سلامت و بهداشت','نقوی'],[3,2,2,'شبکه','بیات‌فر'],[4,0,2,'تجارت الکترونیک','صادقی'],[4,2,1,'اجتماعی','فراهانی'],[4,3,1,'عربی','سیفی']];
let S={sch:SEED.map((a,i)=>({id:i,d:a[0],p:a[1],n:a[2],s:a[3],t:a[4],alt:a[5]||''})),hw:[],ex:[],set:{h:16,theme:'system'},anchor:'2026-10-05',id:100};
try{const r=localStorage.getItem('sp1');if(r)S=JSON.parse(r)}catch(e){}
S.hol=S.hol||[];S.bag=S.bag||{all:[]};
const save=()=>{try{localStorage.setItem('sp1',JSON.stringify(S))}catch(e){}};
let tab='home',sel=wdOf(new Date()),adding=false,wk=0,cy=jal(new Date())[0],cm=jal(new Date())[1],sd=iso(new Date());
function theme(){const r=document.documentElement;S.set.theme=='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.set.theme)}
function altOn(d){const w=Math.floor(diff(d,pd(S.anchor))/7);return((w%2)+2)%2?'B':'A'}
function dayItems(wd,date,all){return S.sch.filter(x=>x.d==wd&&(all||!x.alt||x.alt==altOn(date))).sort((a,b)=>a.p-b.p)}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const colr=s=>`background:hsl(${hue(s)} 70% 60%/.17);border-inline-start:4px solid hsl(${hue(s)} 60% 55%)`;
const tm=x=>P[x.p][0]+' – '+P[Math.min(3,x.p+x.n-1)][1];
function rows(list,date,mark){const o=[];list.forEach(x=>{for(let k=0;k<x.n&&x.p+k<4;k++)o.push({x,k,p:x.p+k})});o.sort((a,b)=>a.p-b.p);return o.length?o.map(({x,k,p})=>`<div class="row" style="${colr(x.s)}"><span class="tm">${fa(P[p][0]+' – '+P[p][1])}</span><div class="grow"><b>${esc(x.s)}</b><div class="mu">زنگ ${fa(p+1)} · ${esc(x.t)}</div></div>${mark=='edit'&&k==0?`<button class="btn s" onclick="delC(${x.id})">حذف</button>`:''}</div>`).join(''):'<div class="empty">🌿 بدون کلاس</div>'}
function hwList(l){return l.map(h=>{const d=pd(h.date),n=diff(d,new Date());return`<div class="card hw"><input type="checkbox" ${h.done?'checked':''} onchange="tog(${h.id})"><div class="grow ${h.done?'done':''}"><b>${esc(h.title)}</b><div class="mu">${esc(h.c)} · تحویل ${jstr(d)} ${h.done?'':'· '+(n<0?'🔴 عقب‌افتاده':n==0?'🔴 امروز':n==1?'🟠 فردا':'🟢 '+fa(n)+' روز دیگر')} ${h.pri=='زیاد'?'<span class="tag">زیاد</span>':''}</div>${h.desc?`<div class="mu">${esc(h.desc)}</div>`:''}</div><button class="btn s" onclick="delH(${h.id})">✕</button></div>`}).join('')||'<div class="empty">تکلیفی نیست 🎉</div>'}
function exList(l){return l.map(e=>{const n=diff(pd(e.date),new Date());return`<div class="card hw"><div class="grow"><b>${esc(e.c)}</b> ${e.imp=='زیاد'?'<span class="tag">مهم</span>':''}<div class="mu">${jstr(pd(e.date))} · ${fa(e.time||'')} ${esc(e.desc||'')}</div></div><b style="color:var(--pr)">${n<0?'گذشته':n==0?'امروز':fa(n)+' روز'}</b><button class="btn s" onclick="delE(${e.id})">✕</button></div>`}).join('')||'<div class="empty">امتحانی ثبت نشده</div>'}
const EV=[[1,1,'عید نوروز و عید سعید فطر',1],[1,2,'عید نوروز',1],[1,3,'عید نوروز',1],[1,4,'عید نوروز',1],[1,12,'روز جمهوری اسلامی',1],[1,13,'روز طبیعت (سیزده‌به‌در)',1],[1,25,'شهادت امام جعفر صادق (ع)',1],[2,10,'روز ملی خلیج فارس'],[3,6,'عید سعید قربان',1],[3,14,'رحلت امام خمینی (ره)',1],[3,15,'قیام ۱۵ خرداد و عید غدیر خم',1],[4,3,'تاسوعای حسینی',1],[4,4,'عاشورای حسینی',1],[5,13,'اربعین حسینی',1],[5,21,'رحلت پیامبر (ص) و شهادت امام حسن (ع)',1],[5,22,'شهادت امام رضا (ع)',1],[5,30,'شهادت امام حسن عسکری (ع)',1],[6,8,'میلاد پیامبر (ص) و امام صادق (ع)',1],[7,7,'روز آتش‌نشانی و ایمنی'],[7,14,'روز دامپزشکی'],[7,16,'روز ملی کودک'],[7,20,'بزرگداشت حافظ'],[8,13,'روز دانش‌آموز'],[8,22,'شهادت حضرت فاطمه (س)',1],[8,24,'روز کتاب و کتابخوانی'],[9,16,'روز دانشجو'],[10,2,'ولادت امام علی (ع) و روز پدر',1],[10,16,'مبعث پیامبر (ص)',1],[10,22,'ولادت امام حسین (ع) و روز پاسدار'],[10,23,'ولادت ابوالفضل (ع) و روز جانباز'],[10,24,'ولادت امام زین‌العابدین (ع)'],[11,4,'نیمه شعبان',1],[11,22,'پیروزی انقلاب اسلامی',1],[12,3,'ولادت امام حسن (ع)'],[12,5,'روز مهندس'],[12,9,'شهادت امام علی (ع)',1],[12,19,'عید سعید فطر',1],[12,20,'تعطیل عید فطر',1],[12,29,'ملی شدن صنعت نفت',1]];
const evOf=d=>{const j=jal(d);return j[0]==1405?EV.filter(e=>e[0]==j[1]&&e[1]==j[2]).map(e=>({t:e[2],off:e[3]})):[]};
const isHol=d=>S.hol.includes(iso(d))||evOf(d).some(e=>e.off);
const cmv=n=>{cm+=n;if(cm>12){cm=1;cy++}if(cm<1){cm=12;cy--}draw()};
function calView(){const g=j2g(cy,cm,1),first=new Date(g[0],g[1]-1,g[2]),ng=cm==12?j2g(cy+1,1,1):j2g(cy,cm+1,1),len=diff(new Date(ng[0],ng[1]-1,ng[2]),first),tdy=iso(new Date()),evs=[];let c='<span></span>'.repeat(wdOf(first));
for(let i=0;i<len;i++){const d=add(first,i),k=iso(d),e=evOf(d),off=isHol(d)||wdOf(d)==6;if(e.length)evs.push([i+1,e]);c+=`<div class="cd ${off?'off':''} ${k==tdy?'td':''} ${k==sd?'sl':''}" onclick="sd='${k}';draw()">${fa(i+1)}${e.length?'<i></i>':''}</div>`}
const sdd=pd(sd),se=evOf(sdd),sh=S.hw.filter(h=>h.date==sd),sx=S.ex.filter(e=>e.date==sd);
return`<div class="hw"><button class="chip" onclick="cmv(-1)">›</button><h1 class="grow" style="text-align:center">${M[cm-1]} ${fa(cy)}</h1><button class="chip" onclick="cmv(1)">‹</button></div>
<div class="card"><div class="cal">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="wh">${x}</div>`).join('')}${c}</div></div>
<div class="card"><b>${D[wdOf(sdd)]} ${jstr(sdd)}</b>${se.map(x=>`<div>${x.off?'🏖️':'📌'} ${esc(x.t)}</div>`).join('')}${sh.map(h=>`<div>📝 ${esc(h.title)}</div>`).join('')}${sx.map(e=>`<div>🧪 امتحان ${esc(e.c)}</div>`).join('')}${se.length+sh.length+sx.length?'':'<div class="mu">چیزی ثبت نشده</div>'}</div>
<h2>مناسبت‌های ${M[cm-1]}</h2>${evs.map(([d,e])=>`<div class="hw" style="padding:3px 0"><b style="min-width:64px">${fa(d)} ${M[cm-1]}</b><span class="grow">${e.map(x=>esc(x.t)).join('، ')}</span>${e.some(x=>x.off)?'<span class="tag" style="background:rgba(225,29,72,.15);color:#e11d48">تعطیل</span>':''}</div>`).join('')||`<div class="mu">${cy==1405?'مناسبتی ثبت نشده':'مناسبت‌ها فقط برای ۱۴۰۵ ثبت شده‌اند'}</div>`}
<div class="mu" style="margin-top:10px">تعطیلات رسمی ۱۴۰۵؛ مناسبت‌های قمری ممکن است یک روز جابه‌جا شوند.</div>`}
const greet=h=>h<11?'صبح بخیر':h<15?'ظهر بخیر':h<19?'عصر بخیر':'شب بخیر';
function nowInfo(){const n=new Date(),wd=wdOf(n);if(isHol(n))return'🏖️ امروز تعطیل است';const ps=[];dayItems(wd,n).forEach(x=>{for(let k=0;k<x.n&&x.p+k<4;k++)ps.push({s:x.s,p:x.p+k})});ps.sort((a,b)=>a.p-b.p);
const t=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),sec=h=>{const[a,b]=h.split(':');return a*3600+b*60},f=s=>fa([~~(s/3600),~~(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':'));
for(const c of ps){const a=sec(P[c.p][0]),b=sec(P[c.p][1]);if(t>=a&&t<b)return`<span class="tag">در حال برگزاری</span><h2 style="margin:6px 0 0">${esc(c.s)}</h2><div class="mu">${fa(P[c.p][0]+' – '+P[c.p][1])} · ${fa(Math.ceil((b-t)/60))} دقیقه تا پایان کلاس</div>`;
if(t<a)return`<span class="tag">کلاس بعدی</span><h2 style="margin:6px 0 0">${esc(c.s)}</h2><div class="mu">ساعت ${fa(P[c.p][0])} · <b dir="ltr">${f(a-t)}</b> مانده</div>`}
return'✅ کلاس‌های امروز تمام شد'}
function busy(date,wd){if(isHol(date))return'';let c=0;dayItems(wd,date).forEach(x=>c+=x.n);const h=S.hw.filter(x=>!x.done&&x.date==iso(date)).length,e=S.ex.filter(x=>x.date==iso(date)).length;return c+h+e*2>=6?`<div class="card" style="border-color:#f59e0b">⚠️ روز نسبتاً شلوغی داری: ${fa(c)} زنگ، ${fa(h)} تکلیف، ${fa(e)} امتحان</div>`:''}
function bagCard(wd){const it=[['all',S.bag.all||[]],[wd,S.bag[wd]||[]]].flatMap(([k,a])=>a.map(x=>`<label class="hw" style="padding:4px 0"><input type="checkbox" ${x.ok?'checked':''} onchange="tb('${k}',${x.id})"><span class="${x.ok?'done':''}">${esc(x.t)}</span></label>`)).join('');return it?`<h2>🎒 کیف مدرسه</h2><div class="card">${it}</div>`:''}
const tb=(k,i)=>{const x=S.bag[k].find(y=>y.id==i);x.ok=!x.ok;save();draw()};
function addB(){const k=v('bk');if(!v('bi'))return;(S.bag[k]=S.bag[k]||[]).push({id:S.id++,t:v('bi'),ok:false});save();draw()}
const delB=(k,i)=>{S.bag[k]=S.bag[k].filter(x=>x.id!=i);save();draw()};
function addHol(){const d=parseJ(v('hl'));if(!d)return alert('تاریخ را مثل ۱۴۰۵/۰۷/۲۰ وارد کن');if(!S.hol.includes(d))S.hol.push(d);save();draw()}
const delHol=d=>{S.hol=S.hol.filter(x=>x!=d);save();draw()};
function exp(){const t=document.getElementById('bkp');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function imp(){try{const o=JSON.parse(v('bkp'));if(!o.sch)throw 0;S=o;save();location.reload()}catch(e){alert('نسخه پشتیبان معتبر نیست')}}
const subjects=()=>[...new Set(S.sch.map(x=>x.s))];
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
const today=()=>jfull(new Date());
function view(){
  const now=new Date(),late=now.getHours()>=S.set.h,date=late?add(now,1):now,wd=wdOf(date);
  const pend=S.hw.filter(h=>!h.done).sort((a,b)=>a.date<b.date?-1:1),exs=S.ex.filter(e=>diff(pd(e.date),now)>=0).sort((a,b)=>a.date<b.date?-1:1);
  if(tab=='home')return`<h1>${greet(now.getHours())} 👋</h1><div class="mu">امروز چه برنامه‌ای داری؟ · ${D[wdOf(now)]} ${jstr(now)}</div>
  <div class="card" id="nc">${nowInfo()}</div>${busy(date,wd)}<div class="card hero"><div class="mu">${late?'فردا':'امروز'}</div><h1>${D[wd]} ${jstr(date)}</h1>${isHol(date)?'<div class="empty">🏖️ تعطیل</div>':rows(dayItems(wd,date),date)}</div>${bagCard(wd)}
  <h2>تکالیف نزدیک</h2>${(o=>o?`<div class="mu" style="color:#b42318">${fa(o)} تکلیف عقب‌افتاده</div>`:'')(pend.filter(h=>diff(pd(h.date),now)<0).length)}${hwList(pend.slice(0,3))}<h2>امتحان‌های پیش‌رو</h2>${exList(exs.slice(0,3))}`;
  if(tab=='week'){const dt=add(next(sel),7*wk);return`<h1>برنامه هفتگی</h1><div class="chips">${D.map((n,i)=>`<button class="chip ${i==sel?'on':''}" onclick="sel=${i};draw()">${n}</button>`).join('')}</div>
  <div class="chips" style="margin-top:6px"><button class="chip ${wk==0?'on':''}" onclick="wk=0;draw()">این هفته</button><button class="chip ${wk==1?'on':''}" onclick="wk=1;draw()">هفته بعد</button></div>
  <div class="mu" style="margin:6px 2px">${D[sel]} ${jstr(dt)}</div><div class="card">${rows(dayItems(sel,dt),dt,'edit')}</div>
  <button class="btn" onclick="adding=!adding;draw()">＋ افزودن کلاس به ${D[sel]}</button>
  ${adding?`<div class="card"><div class="g2"><select id="cp">${P.map((p,i)=>`<option value="${i}">زنگ ${fa(i+1)}</option>`).join('')}</select><select id="cn"><option value="1">یک زنگ</option><option value="2">دو زنگ</option></select></div><input id="cs" list="sl" placeholder="نام درس"><datalist id="sl">${opts(subjects())}</datalist><input id="ct" placeholder="معلم"><button class="btn" onclick="addC()">ذخیره</button></div>`:''}`}
  if(tab=='hw')return`<h1>تکالیف</h1><div class="card"><select id="hc">${opts(subjects())}</select><input id="ht" placeholder="عنوان تکلیف"><input id="hd" placeholder="توضیحات"><div class="g2"><input id="hj" value="${today()}" placeholder="تاریخ شمسی ۱۴۰۵/۰۷/۱۵"><select id="hp"><option>متوسط</option><option>زیاد</option><option>کم</option></select></div><button class="btn" onclick="addH()">افزودن تکلیف</button></div>${hwList([...pend,...S.hw.filter(h=>h.done)])}`;
  return`<h1>بیشتر</h1><h2>امتحان‌ها</h2><div class="card"><select id="ec">${opts(subjects())}</select><div class="g2"><input id="ej" value="${today()}"><input id="et" placeholder="ساعت ۰۸:۰۰"></div><div class="g2"><input id="ed" placeholder="توضیحات"><select id="ei"><option>متوسط</option><option>زیاد</option><option>کم</option></select></div><button class="btn" onclick="addE()">افزودن امتحان</button></div>${exList(exs)}
  <h2>🎒 کیف مدرسه</h2><div class="card"><select id="bk"><option value="all">وسایل روزانه</option>${D.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select><input id="bi" placeholder="مثلاً لپ‌تاپ"><button class="btn" onclick="addB()">افزودن</button>${Object.keys(S.bag).flatMap(k=>S.bag[k].map(x=>`<div class="hw"><span class="grow">${k=='all'?'روزانه':D[k]}: ${esc(x.t)}</span><button class="btn s" onclick="delB('${k}',${x.id})">✕</button></div>`)).join('')}</div>
  <h2>روزهای تعطیل</h2><div class="card"><input id="hl" value="${today()}"><button class="btn" onclick="addHol()">افزودن تعطیلی</button>${S.hol.map(d=>`<div class="hw"><span class="grow">${jstr(pd(d))}</span><button class="btn s" onclick="delHol('${d}')">✕</button></div>`).join('')}</div>
  <h2>پشتیبان‌گیری</h2><div class="card"><textarea id="bkp" placeholder="متن پشتیبان اینجا نمایش داده می‌شود یا برای بازیابی اینجا بچسبان"></textarea><div class="g2"><button class="btn" onclick="exp()">گرفتن و کپی</button><button class="btn" onclick="imp()">بازیابی</button></div></div>
  <h2>تنظیمات</h2><div class="card"><label class="mu">از این ساعت به بعد «فردا» نمایش داده شود</label><input type="number" min="0" max="23" value="${S.set.h}" onchange="S.set.h=+this.value;save()">
  <label class="mu">پوسته</label><select onchange="S.set.theme=this.value;save();theme()"><option value="system" ${S.set.theme=='system'?'selected':''}>سیستم</option><option value="light" ${S.set.theme=='light'?'selected':''}>روشن</option><option value="dark" ${S.set.theme=='dark'?'selected':''}>تاریک</option></select>
  <label class="mu">دوشنبه‌های متناوب (دفاعی / اخلاق حرفه‌ای)</label><div class="mu">این هفته: ${altOn(next(2))=='A'?'دفاعی':'اخلاق حرفه‌ای'}</div><button class="btn" onclick="swap()">جابه‌جایی دو هفته</button>
  <button class="btn" style="background:#b42318" onclick="if(confirm('همه چیز پاک شود؟')){localStorage.removeItem('sp1');location.reload()}">بازنشانی کامل</button></div>`}
function draw(){const A=document.getElementById('app'),ch=window.lt!=tab;window.lt=tab;A.classList.toggle('in',ch);document.getElementById('app').innerHTML=(tab=='cal'?calView():view())+(tab=='home'?'<button class="fab" aria-label="تکلیف جدید" onclick="tab=\'hw\';draw();scrollTo(0,0);setTimeout(()=>document.getElementById(\'ht\').focus(),50)">＋</button>':'');document.getElementById('nav').innerHTML=[['home','🏠','خانه'],['week','🗓️','برنامه'],['cal','📅','تقویم'],['hw','✅','تکالیف'],['more','⚙️','بیشتر']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';draw();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('')}
const v=i=>document.getElementById(i).value.trim();
function addC(){if(!v('cs'))return;S.sch.push({id:S.id++,d:sel,p:+v('cp'),n:Math.min(+v('cn'),4-+v('cp')),s:v('cs'),t:v('ct'),alt:''});adding=false;save();draw()}
function delC(i){S.sch=S.sch.filter(x=>x.id!=i);save();draw()}
function addH(){const d=parseJ(v('hj'));if(!v('ht')||!d)return alert('عنوان و تاریخ (مثل ۱۴۰۵/۰۷/۱۵) را درست وارد کن');S.hw.push({id:S.id++,c:v('hc'),title:v('ht'),desc:v('hd'),date:d,pri:v('hp'),done:false});save();draw()}
function addE(){const d=parseJ(v('ej'));if(!d)return alert('تاریخ را مثل ۱۴۰۵/۰۸/۱۰ وارد کن');S.ex.push({id:S.id++,c:v('ec'),date:d,time:v('et'),desc:v('ed'),imp:v('ei')});save();draw()}
const tog=i=>{const h=S.hw.find(x=>x.id==i);h.done=!h.done;save();draw()};
const delH=i=>{S.hw=S.hw.filter(x=>x.id!=i);save();draw()};
const delE=i=>{S.ex=S.ex.filter(x=>x.id!=i);save();draw()};
function swap(){S.anchor=iso(add(pd(S.anchor),7));save();draw()}
theme();draw();setInterval(()=>{if(tab=='home')draw()},60000);setInterval(()=>{const e=document.getElementById('nc');if(e)e.innerHTML=nowInfo()},1000);
</script></body></html>
